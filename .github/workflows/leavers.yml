name: HF Leavers Monitor
on:
  schedule:
    # 10:47 UTC = 6:47am ET. IAPD regenerates ADV report PDFs around 09:10 UTC the day after
    # a filing, so this catches yesterday's filings the same morning.
    - cron: "47 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: leavers
  cancel-in-progress: false
jobs:
  run-leavers:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pdfplumber pypdf pandas openpyxl
      - name: Run leavers monitor (25-minute chunks, progress committed after each)
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          commit_state () {
            for f in schedule_a_snapshot.json leavers_universe.json; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "chore: update leavers state [$(date -u '+%Y-%m-%d %H:%M UTC')]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          }
          for chunk in 1 2 3 4 5 6 7 8; do
            echo "=== Chunk $chunk ==="
            set +e
            python leavers.py
            code=$?
            set -e
            commit_state
            if [ "$code" -eq 0 ]; then echo "Done for today."; exit 0; fi
            if [ "$code" -ne 10 ]; then echo "Script error (exit $code)"; exit "$code"; fi
          done
          echo "Chunk limit reached; remaining work continues tomorrow."
